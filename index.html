<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Pengingat Tugas - Dark Mode Interaktif</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border-color: #334155;
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.4);
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 🌙 ANIMASI INTERAKTIF PADA IKON BULAN 🌙 */
    .moon-icon {
      font-size: 24px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
    }

    /* Efek saat Kursor Mengenai Bulan (Hover) */
    .moon-icon:hover {
      transform: scale(1.3) rotate(25deg);
      filter: drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 0 20px #fef08a);
      animation: pulseGlow 1.5s infinite alternate;
    }

    /* Efek saat Bulan Diklik */
    .moon-icon:active {
      transform: scale(0.95) rotate(-15deg);
    }

    /* Animasi Denyut Cahaya (Glow Pulse) */
    @keyframes pulseGlow {
      0% {
        filter: drop-shadow(0 0 6px var(--cyan));
      }
      100% {
        filter: drop-shadow(0 0 18px #fef08a) drop-shadow(0 0 25px var(--cyan));
      }
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--cyan);
    }

    .btn-notif {
      background: rgba(56, 189, 248, 0.1);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-notif:hover {
      background: rgba(56, 189, 248, 0.25);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .form-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .btn-submit {
      background: var(--cyan);
      color: #0f172a;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--cyan);
    }

    .task-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      transition: all 0.2s ease;
    }

    .task-item:hover {
      border-color: var(--cyan);
      transform: translateY(-1px);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--green);
    }

    .task-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .task-title {
      font-size: 14px;
      color: var(--text);
    }

    .task-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .deadline-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
      font-weight: 500;
    }

    .badge-normal { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }
    .badge-warning { background: rgba(250, 204, 21, 0.15); color: var(--yellow); }
    .badge-overdue { background: rgba(248, 113, 113, 0.15); color: var(--red); }
    .badge-success { background: rgba(74, 222, 128, 0.15); color: var(--green); }

    .btn-delete {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: rgba(248, 113, 113, 0.2);
      color: var(--red);
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-title">
        <!-- Ikon Bulan dengan Animasi Hover Interaktif -->
        <span class="moon-icon" id="moonIcon" title="Arahkan kursor atau klik aku!">🌙</span>
        <h1>Daftar Tugas Ku</h1>
      </div>
      <button class="btn-notif" id="notifBtn" onclick="requestNotificationPermission()">
        🔔 <span id="notifText">Notifikasi</span>
      </button>
    </div>

    <form class="form-card" onsubmit="addTask(event)">
      <input type="text" id="taskInput" class="input-field" placeholder="Ketik tugas baru..." required />
      <div class="form-row">
        <input type="datetime-local" id="deadlineInput" class="input-field" />
        <button type="submit" class="btn-submit">+ Tambah</button>
      </div>
    </form>

    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">Semua</button>
        <button class="tab-btn" onclick="setFilter('active', this)">Aktif</button>
        <button class="tab-btn" onclick="setFilter('completed', this)">Selesai</button>
      </div>
      <span class="task-count" id="taskCount">0 Tugas</span>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    let tasks = [];
    let currentFilter = 'all';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAlarmSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, now);
      osc.frequency.setValueAtTime(1200, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playCheckSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.1);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

    try {
      const saved = localStorage.getItem('myTodoListDarkV2');
      if (saved) tasks = JSON.parse(saved);
    } catch (e) {}

    function requestNotificationPermission() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            playCheckSound();
            document.getElementById('notifText').innerText = "Notifikasi Aktif";
            alert("Notifikasi & Suara Aktif!");
          }
        });
      }
    }

    function saveTasks() {
      localStorage.setItem('myTodoListDarkV2', JSON.stringify(tasks));
    }

    function setFilter(filter, element) {
      currentFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      renderTasks();
    }

    function renderTasks() {
      const taskList = document.getElementById('taskList');
      const taskCount = document.getElementById('taskCount');
      taskList.innerHTML = '';

      let filteredTasks = tasks.filter(task => {
        if (currentFilter === 'active') return !task.completed;
        if (currentFilter === 'completed') return task.completed;
        return true;
      });

      const activeCount = tasks.filter(t => !t.completed).length;
      taskCount.textContent = `${activeCount} Tugas Sisa`;

      if (filteredTasks.length === 0) {
        taskList.innerHTML = '<div class="empty-state">Belum ada tugas</div>';
        return;
      }

      const now = new Date().getTime();

      filteredTasks.forEach((task) => {
        const realIndex = tasks.indexOf(task);
        const li = document.createElement('li');
        li.className = 'task-item';

        const taskLeft = document.createElement('div');
        taskLeft.className = 'task-left';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.onchange = () => toggleComplete(realIndex);

        const taskContent = document.createElement('div');
        taskContent.className = 'task-content';

        const titleSpan = document.createElement('span');
        titleSpan.className = `task-title ${task.completed ? 'completed' : ''}`;
        titleSpan.textContent = task.text;
        taskContent.appendChild(titleSpan);

        if (task.deadline) {
          const deadlineDate = new Date(task.deadline);
          if (!isNaN(deadlineDate.getTime())) {
            const timeDiff = deadlineDate.getTime() - now;
            const badge = document.createElement('span');
            badge.className = 'deadline-badge ';

            const formattedTime = deadlineDate.toLocaleString('id-ID', {
              day: 'numeric',
              month: 'short',
              hour: '2-digit',
              minute: '2-digit'
            });

            if (task.completed) {
              badge.className += 'badge-success';
              badge.textContent = `✓ Selesai • ${formattedTime}`;
            } else if (timeDiff < 0) {
              badge.className += 'badge-overdue';
              badge.textContent = `! Terlewat • ${formattedTime}`;
            } else if (timeDiff <= 24 * 60 * 60 * 1000) {
              badge.className += 'badge-warning';
              badge.textContent = `⏰ Segera • ${formattedTime}`;
            } else {
              badge.className += 'badge-normal';
              badge.textContent = `📅 ${formattedTime}`;
            }

            taskContent.appendChild(badge);
          }
        }

        taskLeft.appendChild(checkbox);
        taskLeft.appendChild(taskContent);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.textContent = '✕';
        delBtn.onclick = () => deleteTask(realIndex);

        li.appendChild(taskLeft);
        li.appendChild(delBtn);
        taskList.appendChild(li);
      });
    }

    function addTask(event) {
      event.preventDefault();
      const taskInput = document.getElementById('taskInput');
      const deadlineInput = document.getElementById('deadlineInput');

      const text = taskInput.value.trim();
      const deadline = deadlineInput.value;

      if (!text) return;

      tasks.push({
        text: text,
        deadline: deadline || null,
        completed: false,
        notified: false
      });

      saveTasks();
      renderTasks();
      playCheckSound();

      taskInput.value = '';
      deadlineInput.value = '';
    }

    function toggleComplete(index) {
      tasks[index].completed = !tasks[index].completed;
      if (tasks[index].completed) playCheckSound();
      saveTasks();
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveTasks();
      renderTasks();
    }

    function checkReminders() {
      const now = new Date().getTime();
      tasks.forEach((task) => {
        if (!task.completed && task.deadline && !task.notified) {
          const deadlineTime = new Date(task.deadline).getTime();
          if (!isNaN(deadlineTime) && now >= deadlineTime && (now - deadlineTime) < 5 * 60 * 1000) {
            task.notified = true;
            saveTasks();
            playAlarmSound();

            if ("Notification" in window && Notification.permission === "granted") {
              new Notification("⏰ Pengingat Tugas!", {
                body: `Tugas "${task.text}" sudah mencapai deadline!`,
              });
            } else {
              alert(`⏰ PENGINGAT TUGAS:\nTugas "${task.text}" sudah mencapai deadline!`);
            }
          }
        }
      });
    }

    setInterval(checkReminders, 5000);
    renderTasks();
  </script>
</body>
</html>
